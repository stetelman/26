<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TYPESET Print & Play</title>
<style>
:root{--bg:#eee9df;--panel:#fffdf8;--line:#d4cec2;--text:#25231f;--muted:#7f786d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.card{width:min(520px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:34px;text-align:center}
.keys{display:flex;justify-content:center;gap:5px;margin:0 0 24px}
.keys span{display:grid;place-items:center;width:42px;height:42px;background:#fffdf8;border:1px solid var(--line);border-radius:7px;font-weight:900;font-size:15px}
h1{font-size:22px;margin:0 0 8px}
p{margin:0 auto 24px;color:var(--muted);font-size:14px;line-height:1.45;max-width:390px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:8px;border:1px solid var(--line);background:#25231f;color:#fffdf8;text-decoration:none;font-size:12px;font-weight:900;letter-spacing:.04em}
small{display:block;margin-top:16px;color:var(--muted);font-size:11px}
</style>
</head>
<body>
<main class="card">
  <div class="keys" aria-label="TYPESET">
    <span>T</span><span>Y</span><span>P</span><span>E</span><span>S</span><span>E</span><span>T</span>
  </div>
  <h1>Print & Play</h1>
  <p>A two-player TYPESET sheet with an A–Z tracker for each player and a word / lock log.</p>
  <a href="/print/TYPESET_Print_and_Play.pdf" download>DOWNLOAD PDF</a>
  <small>US Letter · landscape · printer friendly</small>
</main>
</body>
</html>
